apiVersion: v1
kind: Service
metadata:
  name: mutual-fund-chatbot-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: mutual-fund-chatbot
---
apiVersion: v1
kind: Service
metadata:
  name: chroma-service
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: chroma
  selector:
    app: mutual-fund-chatbot
    component: chroma
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: mutual-fund-chatbot
    component: redis
