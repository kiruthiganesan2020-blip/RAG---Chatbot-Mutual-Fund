apiVersion: v1
kind: Secret
metadata:
  name: api-keys
type: Opaque
data:
  # Base64 encoded values - replace with actual base64 encoded secrets
  google-ai-studio: <BASE64_GOOGLE_AI_STUDIO_API_KEY>
  # Add other API keys as needed
---
apiVersion: v1
kind: Secret
metadata:
  name: database-secrets
type: Opaque
data:
  # Database credentials if needed
  chroma-password: <BASE64_CHROMA_PASSWORD>
