name: Automated Testing and Quality Assurance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run tests daily at 4 AM UTC (9:30 AM IST)
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-mock pytest-asyncio
    
    - name: Run unit tests
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.13'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        cache: 'pip'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser chromium-chromedriver
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio
    
    - name: Run Phase 1.1.1 tests
      run: |
        echo "Testing Phase 1.1.1: Environment Setup"
        python ingestion/phase1_1_1/run_phase1_1_1_basic.py
    
    - name: Run Phase 1.1.2 tests
      run: |
        echo "Testing Phase 1.1.2: Web Scraping"
        python ingestion/phase1_1_2/run_phase1_1_2_fixed.py
      env:
        DISPLAY: :99
    
    - name: Run Phase 1.1.3 tests
      run: |
        echo "Testing Phase 1.1.3: Content Processing"
        python ingestion/phase1_1_3/run_phase1_1_3_fixed.py
    
    - name: Run Phase 1.2 tests
      run: |
        echo "Testing Phase 1.2: Data Corpus Development"
        python ingestion/phase1_2/run_phase1_2.py
    
    - name: Run Phase 1.3 tests
      run: |
        echo "Testing Phase 1.3: Vector Database Setup"
        python ingestion/phase1_3/run_phase1_3.py
    
    - name: Run Phase 2.1 tests
      run: |
        echo "Testing Phase 2.1: Document Processing Pipeline"
        python ingestion/phase2_1/run_phase2_1.py
    
    - name: Run Phase 2.2 tests
      run: |
        echo "Testing Phase 2.2: Vector Database Setup"
        python ingestion/phase2_2/run_phase2_2.py

  performance-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install memory-profiler
    
    - name: Run embedding model comparison
      run: |
        echo "Running embedding model performance tests..."
        python ingestion/phase2_1/test_embedding_models.py
    
    - name: Run performance benchmarks
      run: |
        echo "Running performance benchmarks..."
        python -c "
        import time
        import psutil
        import json
        from pathlib import Path
        
        # Test embedding generation performance
        print('Testing embedding generation performance...')
        
        start_time = time.time()
        start_memory = psutil.Process().memory_info().rss / 1024 / 1024  # MB
        
        # Simulate embedding generation
        from sentence_transformers import SentenceTransformer
        model = SentenceTransformer('all-MiniLM-L6-v2')
        
        test_texts = [
            'HDFC Large Cap Fund invests in large cap companies',
            'The fund aims for long-term capital appreciation',
            'Investment involves market risks'
        ] * 100  # 300 test texts
        
        embeddings = model.encode(test_texts, batch_size=32)
        
        end_time = time.time()
        end_memory = psutil.Process().memory_info().rss / 1024 / 1024  # MB
        
        performance_report = {
            'total_texts': len(test_texts),
            'embedding_time': end_time - start_time,
            'throughput': len(test_texts) / (end_time - start_time),
            'memory_usage': end_memory - start_memory,
            'embedding_shape': embeddings.shape,
            'timestamp': time.time()
        }
        
        # Save performance report
        with open('performance_report.json', 'w') as f:
            json.dump(performance_report, f, indent=2)
        
        print(f'Performance Report:')
        print(f'- Total texts: {performance_report[\"total_texts\"]}')
        print(f'- Embedding time: {performance_report[\"embedding_time\"]:.2f}s')
        print(f'- Throughput: {performance_report[\"throughput\"]:.1f} texts/sec')
        print(f'- Memory usage: {performance_report[\"memory_usage\"]:.1f} MB')
        print(f'- Embedding shape: {performance_report[\"embedding_shape\"]}')
        "
    
    - name: Upload performance artifacts
      uses: actions/upload-artifact@v3
      with:
        name: performance-report-${{ github.run_number }}
        path: |
          performance_report.json
          data/embedding_models_comparison.json
        retention-days: 30

  quality-checks:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black isort mypy safety bandit
    
    - name: Code quality checks
      run: |
        echo "Running code quality checks..."
        
        # Flake8 linting
        echo "Running flake8..."
        flake8 src/ ingestion/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ ingestion/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
        # Black formatting check
        echo "Checking code formatting with black..."
        black --check --diff src/ ingestion/
        
        # Import sorting check
        echo "Checking import sorting with isort..."
        isort --check-only --diff src/ ingestion/
        
        # Type checking with mypy
        echo "Running type checking with mypy..."
        mypy src/ --ignore-missing-imports
        
        # Security check with bandit
        echo "Running security check with bandit..."
        bandit -r src/ -f json -o bandit-report.json
        
        # Dependency security check with safety
        echo "Checking dependency security with safety..."
        safety check --json --output safety-report.json
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports-${{ github.run_number }}
        path: |
          bandit-report.json
          safety-report.json
        retention-days: 30

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [integration-tests, quality-checks]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add deployment commands here
        echo "Staging deployment completed"

  deploy-production:
    runs-on: ubuntu-latest
    needs: [integration-tests, quality-checks, performance-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Add deployment commands here
        echo "Production deployment completed"
    
    - name: Create deployment notification
      run: |
        echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: Production" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
