services:
  - type: web
    name: hdfc-rag-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-railway.txt
    startCommand: python simple_backend.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
